<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Auth Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="auth-container">
        <div class="card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in</p>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username (e.g., admin)" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password (e.g., password123)" required>
                </div>

                <div id="error-message" class="error-msg hidden">Invalid username or password</div>

                <button type="submit" class="btn">Sign In</button>
            </form>
            
            <div class="hint">
                <small>Hint: Use <strong>admin</strong> / <strong>password123</strong></small>
            </div>
        </div>
    </div>

    <!-- DASHBOARD CONTAINER (Hidden by default) -->
    <div id="dashboard-container" class="dashboard-container hidden">
        <div class="dashboard-card">
            <header class="dashboard-header">
                <h2>Welcome, <span id="user-display">User</span>! 🎉</h2>
                <button id="logout-btn" class="btn-danger">Sign Out</button>
            </header>
            <hr>
            <div class="dashboard-content">
                <p>You have successfully logged into the secure static dashboard.</p>
                <div class="stats-box">
                    <div class="stat-card">
                        <h3>Status</h3>
                        <p class="active">Active Session</p>
                    </div>
                    <div class="stat-card">
                        <h3>Security</h3>
                        <p>Client-side Static Auth</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
